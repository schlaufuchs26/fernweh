<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fernweh – Rate das Land</title>
  <meta name="description" content="Fernweh: ein Land, zehn Hinweise, ein Punktekonto. Jeder Hinweis kostet, jeder falsche Tipp auch." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
  <style>
    :root {
      --bg: #14110f;
      --surface: #201b17;
      --line: #3a322b;
      --text: #f2ece4;
      --muted-text: #a49685;
      --accent: #e8a33d;
      --paper: #f7f1e6;
      --ink: #2a231c;
      --ink-soft: #6b5b49;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background:
        radial-gradient(circle at 15% -10%, #2a2018 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.45;
      padding: 24px 16px 48px;
      min-height: 100vh;
    }
    .app { width: 100%; max-width: 860px; margin: 0 auto; }

    .app-head { margin-bottom: 20px; }
    .app-title { font-size: 1.9rem; letter-spacing: -0.01em; }
    .app-sub { color: var(--muted-text); font-size: 0.92rem; max-width: 52ch; }
    .app-score {
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 600;
    }

    .round {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }
    .round-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--muted-text);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .budget-label { font-variant-numeric: tabular-nums; }
    .budget {
      height: 6px;
      background: #2f2721;
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0 14px;
    }
    .budget-fill {
      height: 100%;
      background: linear-gradient(90deg, #e8a33d, #f5cd84);
      transition: width 0.25s ease;
    }
    .free-clue { font-size: 0.92rem; color: var(--muted-text); }
    .free-clue strong { color: var(--text); }

    .shop {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 8px;
      margin: 14px 0 10px;
    }
    .shop-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      background: #26201b;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      font: inherit;
      font-size: 0.86rem;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }
    .shop-item:hover:not(:disabled) { border-color: var(--accent); }
    .shop-item:active:not(:disabled) { transform: translateY(1px); }
    .shop-item:disabled { opacity: 0.32; cursor: not-allowed; }
    .shop-item .price {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 600;
    }
    .shop-item:disabled .price { color: var(--muted-text); }

    .bought { list-style: none; display: grid; gap: 8px; margin: 12px 0; }
    .clue-card {
      background: var(--paper);
      color: var(--ink);
      border-radius: 8px;
      padding: 10px 14px;
      box-shadow: 0 2px 0 #00000033;
    }
    .clue-card:nth-child(odd) { transform: rotate(-0.35deg); }
    .clue-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }
    .clue-value { font-family: Georgia, "Times New Roman", serif; font-size: 1rem; }

    .hint-line { font-size: 0.78rem; color: var(--muted-text); margin: 4px 0 14px; }

    .guess-row { display: flex; gap: 8px; }
    .guess-input {
      flex: 1;
      padding: 12px 14px;
      font: inherit;
      color: var(--text);
      background: #1a1613;
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .guess-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .suggestions {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .suggestion {
      padding: 6px 12px;
      font: inherit;
      font-size: 0.86rem;
      color: var(--text);
      background: #2a2320;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
    }
    .suggestion:hover { border-color: var(--accent); }

    .wrong {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: #e07b6a;
    }
    .wrong li {
      padding: 3px 10px;
      border: 1px dashed #6b3a30;
      border-radius: 999px;
      text-decoration: line-through;
    }

    .reveal {
      background: var(--paper);
      color: var(--ink);
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
    }
    .reveal-broke { background: #efe6d6; }
    .reveal-head { display: flex; align-items: center; gap: 12px; }
    .reveal-flag { font-size: 2.1rem; line-height: 1; }
    .reveal-kicker {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
    }
    .reveal-name { font-size: 1.5rem; letter-spacing: -0.01em; }
    .fact {
      font-family: Georgia, "Times New Roman", serif;
      margin: 12px 0;
      font-size: 1rem;
      line-height: 1.5;
    }
    .reveal-more { font-size: 0.86rem; color: var(--ink-soft); }
    .reveal-more summary { cursor: pointer; }
    .reveal-clues { list-style: none; display: grid; gap: 4px; margin-top: 8px; }
    .reveal-clues strong { color: var(--ink); }

    .next {
      margin-top: 14px;
      padding: 11px 20px;
      font: inherit;
      font-weight: 600;
      color: #241c14;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      cursor: pointer;
    }
    .next:hover { background: #f5cd84; }

    .summary-total { font-size: 2.2rem; color: var(--accent); }
    .summary-max { font-size: 0.95rem; color: var(--muted-text); font-weight: 400; }
    .summary-verdict { color: var(--muted-text); margin-bottom: 16px; }
    .summary-list { list-style: none; display: grid; gap: 6px; }
    .summary-row {
      display: grid;
      grid-template-columns: 2rem 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 0.9rem;
    }
    .summary-points { color: var(--accent); font-variant-numeric: tabular-nums; }
    .summary-clues { color: var(--muted-text); font-size: 0.8rem; }

    @media (max-width: 520px) {
      .app-title { font-size: 1.6rem; }
      .summary-row { grid-template-columns: 1.6rem 1fr auto; }
      .summary-clues { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./frontend.tsx"></script>
</body>
</html>
